# Классы электроприемников котельной и ключевые слова для их поиска в экспликации/подписях

pump:
  keywords: ["насос", "насосн"]
  subtypes:
    make_up: ["подпиточ", "подпитк"]
    network: ["сетев"]
    recirc: ["рецирк", "котлов"]
    circulation: ["циркул"]
    raw_water: ["исходн", "хов", "хво", "водоподготов"]
    drain: ["дренаж", "слив"]
    dosing: ["дозир", "реагент"]

fan:
  keywords: ["вентилятор", "дымосос", "дутьев", "вытяж"]
  subtypes:
    supply: ["приточ"]
    exhaust: ["вытяж"]

burner:
  keywords: ["горелк"]

cabinet:
  keywords: ["шкаф", "щу", "шау", "автоматика", "щуп", "шук", "шкаф управления"]

other:
  keywords: ["компрессор", "ибп", "авр", "щит", "освещ", "розет"]
